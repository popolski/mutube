workflows:
  mutube:
    name: MuTube IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - mutube # must define YOUTUBE_IPA_URL (private direct link to YouTube_4.54.01_decrypted.ipa)
    scripts:
      - name: Install uv
        script: brew install uv
      - name: Fetch decrypted YouTube IPA
        script: |
          mkdir -p ipa
          curl -fL "$YOUTUBE_IPA_URL" -o ipa/YouTube_4.54.01_decrypted.ipa
      - name: Check IPA (version must be 4.54.01, cryptid must be 0)
        script: |
          rm -rf /tmp/ipa && unzip -q ipa/YouTube_4.54.01_decrypted.ipa -d /tmp/ipa
          APP=$(ls -d /tmp/ipa/Payload/*.app)
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "$VER"
          [ "$VER" = "4.54.01" ] || { echo "Wrong YouTube version: $VER (need 4.54.01)"; exit 1; }
          otool -l "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" | grep -A4 LC_ENCRYPTION_INFO | grep cryptid
          echo "TizenTube strings (must be 0 for a clean IPA):"
          TT=$(grep -c -a -i tizentube "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" || true)
          echo "$TT"
          [ "$TT" = "0" ] || { echo "IPA is already patched (TizenTube found). Need a clean YouTube IPA."; exit 1; }
          ls "$APP/Frameworks" 2>/dev/null
      - name: Build
        script: make
    artifacts:
      - mutube.ipa
  inspect-prebuilt:
    name: Inspect prebuilt MuTube IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - mutube # YOUTUBE_IPA_URL = the prebuilt MuTube IPA to inspect
    scripts:
      - name: Install uv
        script: brew install uv
      - name: Fetch prebuilt IPA
        script: curl -fL "$YOUTUBE_IPA_URL" -o /tmp/prebuilt.ipa && shasum -a 256 /tmp/prebuilt.ipa
      - name: Compare against every MuTube 4.54.01 patcher version
        script: |
          git fetch --unshallow -q || true
          for c in $(git rev-list 8a8b260^..HEAD -- patcher.py inject.js); do
            echo "=== MuTube commit $c: $(git log -1 --format=%s $c)"
            d=/tmp/v/$c && mkdir -p $d
            git show $c:patcher.py > $d/patcher.py && git show $c:inject.js > $d/inject.js
            cp verify_prebuilt.py $d/
            (cd $d && uv run -q verify_prebuilt.py /tmp/prebuilt.ipa) || true
          done
